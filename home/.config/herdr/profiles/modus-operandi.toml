onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#d7d7d7"
selection_bg = "#bdbdbd"
surface_dim = "#e0e0e0"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 38

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#0031a9", bold = true },
    { token = "tab", fg = "#595959", dim = true },
  ],
  [
    { token = "agent", fg = "#721045" },
    { token = "state_text", fg = "#595959", dim = true },
  ],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#0031a9", bold = true },
  ],
  [
    { token = "branch", fg = "#006800" },
    { token = "git_status", fg = "#595959", dim = true },
  ],
]

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
