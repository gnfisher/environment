onboarding = false

[theme]
name = "dracula"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#44475a"
selection_bg = "#6272a4"
surface_dim = "#21222c"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 38

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#8be9fd", bold = true },
    { token = "tab", fg = "#6272a4", dim = true },
  ],
  [
    { token = "agent", fg = "#ff79c6" },
    { token = "state_text", fg = "#6272a4", dim = true },
  ],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#8be9fd", bold = true },
  ],
  [
    { token = "branch", fg = "#50fa7b" },
    { token = "git_status", fg = "#6272a4", dim = true },
  ],
]

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
