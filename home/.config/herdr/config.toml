onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#425047"
selection_bg = "#543a48"
surface_dim = "#232a2e"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 38

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#7fbbb3", bold = true },
    { token = "tab", fg = "#7a8478", dim = true },
  ],
  [
    { token = "agent", fg = "#d699b6" },
    { token = "state_text", fg = "#859289", dim = true },
  ],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#7fbbb3", bold = true },
  ],
  [
    { token = "branch", fg = "#a7c080" },
    { token = "git_status", fg = "#859289", dim = true },
  ],
]

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
