onboarding = false

[theme]
name = "terminal"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 38

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
open_worktree = "prefix+shift+o"
